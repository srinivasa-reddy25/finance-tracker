<svg width="1200" height="1400" viewBox="0 0 1200 1400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loginTitle loginDesc">
  <title id="loginTitle">Login Illustration</title>
  <desc id="loginDesc">Abstract layered geometric artwork with gradients for authentication page background.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1080" y2="1320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4E4CD"/>
      <stop offset="1" stop-color="#EAD7BD"/>
    </linearGradient>

    <linearGradient id="panel" x1="280" y1="240" x2="940" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B6225"/>
      <stop offset="1" stop-color="#2B471B"/>
    </linearGradient>

    <linearGradient id="accentA" x1="170" y1="310" x2="780" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E99479"/>
      <stop offset="1" stop-color="#D46F4F"/>
    </linearGradient>

    <linearGradient id="accentB" x1="360" y1="520" x2="980" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFA674"/>
      <stop offset="1" stop-color="#B88A57"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 220) rotate(140) scale(480 360)">
      <stop stop-color="#E99479" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E99479" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 1180) rotate(-30) scale(520 380)">
      <stop stop-color="#AFC39D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#AFC39D" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurSoft" x="-200" y="-200" width="1600" height="1800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <filter id="shadow" x="120" y="160" width="960" height="1120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="16"/>
      <feGaussianBlur stdDeviation="22"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.26 0 0 0 0 0.12 0 0 0 0.32 0"/>
      <feBlend in2="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="1400" fill="url(#bg)"/>

  <g filter="url(#blurSoft)">
    <ellipse cx="950" cy="220" rx="360" ry="270" fill="url(#glowTop)"/>
    <ellipse cx="240" cy="1180" rx="390" ry="280" fill="url(#glowBottom)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="210" width="760" height="980" rx="48" fill="url(#panel)"/>
  </g>

  <path d="M300 980C420 840 550 780 740 740C820 724 900 672 980 570V1190H300V980Z" fill="url(#accentB)" fill-opacity="0.82"/>
  <path d="M220 760C360 640 470 560 630 500C780 446 860 392 980 270V650C860 760 760 830 590 900C450 956 356 1018 220 1140V760Z" fill="url(#accentA)" fill-opacity="0.88"/>

  <g opacity="0.42">
    <path d="M220 460C340 380 450 332 610 286C760 242 860 188 980 120" stroke="white" stroke-opacity="0.48" stroke-width="10" stroke-linecap="round"/>
    <path d="M220 610C340 530 450 482 610 436C760 392 860 338 980 270" stroke="white" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 1130C360 1020 470 964 640 918C790 876 900 816 980 750" stroke="white" stroke-opacity="0.36" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g opacity="0.55">
    <circle cx="330" cy="330" r="7" fill="white"/>
    <circle cx="430" cy="380" r="5" fill="white"/>
    <circle cx="540" cy="430" r="6" fill="white"/>
    <circle cx="630" cy="470" r="4" fill="white"/>
    <circle cx="760" cy="540" r="7" fill="white"/>
    <circle cx="870" cy="610" r="5" fill="white"/>
    <circle cx="320" cy="1110" r="6" fill="white"/>
    <circle cx="440" cy="1040" r="4" fill="white"/>
    <circle cx="560" cy="980" r="5" fill="white"/>
    <circle cx="690" cy="940" r="4" fill="white"/>
  </g>
</svg>
